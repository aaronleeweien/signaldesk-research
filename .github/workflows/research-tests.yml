name: SignalDesk Research Tests
on:
  pull_request:
  push:
    branches:
      - signaldesk-sec-fundamentals-daily-email-20261025
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q research tests
      - name: Run research regression and safety tests
        run: python -m unittest discover -s tests -v
