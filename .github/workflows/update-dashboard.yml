name: Update SignalDesk
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '45 1 * * 2-6'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: signaldesk-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Run research on actual historical market data
        run: python engine.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
