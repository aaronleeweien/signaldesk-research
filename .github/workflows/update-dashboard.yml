name: Update SignalDesk
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '45 1 * * 2-6'
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: signaldesk-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify backtest accounting with synthetic data
        run: python -m unittest discover -s tests -v
      - name: Run research on actual historical market data
        run: python engine.py
      - name: Run separate multi-ETF research experiment
        run: python research/rotation_experiment.py
      - name: Run comprehensive Quant Lab sector and swing-trading research
        run: python research/quant_lab.py
      - name: Run cross-sectional stock-opportunity research and generate dashboard
        run: python research/stocks_v1.py
      - name: Run investable SPMO historical factor ETF strategies
        run: python research/factor_etf.py
      - name: Research established investable ETF strategy performance
        run: python research/established_strategies.py
      - name: Screen wider US exchange market and value/growth opportunities (research-only)
        run: python research/market_discovery.py
      - name: Build daily interactive invest or trade decision hub from researched asset universe
        run: python research/decision_hub.py
      - name: Scan ETFs and stocks for daily momentum, then backtest the fixed rules
        run: python research/daily_scanner.py
      - name: Archive permanent factor ETF paper signals
        run: python research/factor_paper.py
      - name: Record timestamped, future-only stock research allocations
        run: python research/stocks_paper.py
      - name: Record permanent paper-only strategy snapshots
        run: python research/paper_journal.py
      - name: Add plain-English first answers to legacy pages (presentation only)
        run: python research/simplify_archive_pages.py
      - name: Verify primary-source SEC filings for a few screened stocks
        env:
          SIGNALDESK_SEC_USER_AGENT: ${{ secrets.SIGNALDESK_SEC_USER_AGENT }}
          SIGNALDESK_MAIL_TO: ${{ secrets.SIGNALDESK_MAIL_TO }}
        run: python research/sec_fundamentals.py
      - name: Write daily news-style investment report from completed research (no model changes)
        run: python research/editorial_report.py
      - name: Assemble source-verified, concentrated company and commodity dossiers
        env:
          SIGNALDESK_SEC_USER_AGENT: ${{ secrets.SIGNALDESK_SEC_USER_AGENT }}
          SIGNALDESK_MAIL_TO: ${{ secrets.SIGNALDESK_MAIL_TO }}
        run: python research/deep_dossier.py
      - name: Add dated market headlines and conditional economic narratives (no paid API)
        run: python research/narrative_watch.py
      - name: Independently investigate and challenge the focused theses using AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SIGNALDESK_RESEARCH_MODEL: gpt-6.1-sol
        run: python research/deep_investigate.py
      - name: Publish focused evidence-backed research at the existing report URL
        run: python research/deep_publish.py
      - name: Save public summary for connected assistants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/focused_dossier.json research/ai_investigation.json research/focused_report.json research/sec_fundamentals.json latest_report.md latest_report.json research/rotation_results.md research/rotation_results.json research/lab_v3.md research/lab_v3.json research/paper_signals.csv research/stocks_v1.md research/stocks_v1.json research/stocks_paper.csv research/institutional_v4.md research/institutional_v4.json research/factor_etf.md research/factor_etf.json research/factor_paper.csv research/daily_events.csv research/daily_scan_latest.json research/daily_alert_payload.json research/validation_v2.md research/validation_v2.json research/forward_shadow.json research/established_strategies.json research/established_strategies.md research/decision_hub.json research/decision_hub.md research/market_discovery.json research/kotegawa_reversion.json research/daily_brief.md
          if ! git diff --cached --quiet; then
            git commit -m "Update VOO research results [skip ci]"
            git pull --rebase -X theirs origin main
            git push
          fi
      - name: Notify iPhone through assigned GitHub Issue when NEW paper signals occur
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/notify_daily.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Email full report after publishing (scheduled market sessions only)
        if: github.event_name == 'schedule'
        env:
          SIGNALDESK_GMAIL_FROM: ${{ secrets.SIGNALDESK_GMAIL_FROM }}
          SIGNALDESK_MAIL_TO: ${{ secrets.SIGNALDESK_MAIL_TO }}
          SIGNALDESK_GMAIL_APP_PASSWORD: ${{ secrets.SIGNALDESK_GMAIL_APP_PASSWORD }}
        run: python research/email_report.py
      - name: Save private-address-free email delivery receipt
        if: github.event_name == 'schedule'
        run: |
          git add research/email_sent_sessions.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record SignalDesk email market session [skip ci]"
            git pull --rebase -X theirs origin main
            git push
          fi
