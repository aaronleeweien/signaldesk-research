name: Update SignalDesk
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '45 1 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: signaldesk-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify backtest accounting with synthetic data
        run: python -m unittest discover -s tests -v
      - name: Run research on actual historical market data
        run: python engine.py
      - name: Run separate multi-ETF research experiment
        run: python research/rotation_experiment.py
      - name: Save public summary for connected assistants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_report.md latest_report.json research/rotation_results.md research/rotation_results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update VOO research results [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
